name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cross-compiler
        if: matrix.apt != ''
        run: sudo apt-get install -y ${{ matrix.apt }}

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22.12"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download deps
        run: go mod tidy

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p ../dist
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ../dist/aelidecx-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aelidecx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/aelidecx-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "Aelidecx ${{ github.ref_name }}"
          body: |
            ## ${{ github.ref_name }}

            ### Binaires
            | Fichier | Plateforme |
            |---------|------------|
            | `aelidecx-linux-amd64` | Linux x86-64 (PC/serveur) |
            | `aelidecx-linux-arm64` | Linux ARM64 (Android Termux) |

            ### Installation Termux
            ```bash
            chmod +x aelidecx-linux-arm64
            ./aelidecx-linux-arm64
            ```
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
