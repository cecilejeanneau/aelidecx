name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-test-and-coverage:
    name: Backend tests + coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22.12"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download deps
        run: go mod tidy

      - name: Run tests with race + coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Enforce minimum global coverage (35%)
        run: |
          total=$(go tool cover -func=coverage.out | grep total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${total}%"
          awk -v cov="$total" 'BEGIN { exit !(cov+0 >= 35) }'

      - name: Enforce per-package coverage (30% min per package)
        run: |
          FAIL=0
          MIN=30
          for pkg in $(go list ./...); do
            tmpfile=$(mktemp /tmp/cov_XXXXXX.out)
            go test -covermode=atomic -coverprofile="$tmpfile" "$pkg" 2>/dev/null || true
            if [ -s "$tmpfile" ]; then
              pct=$(go tool cover -func="$tmpfile" | grep total: | awk '{print substr($3, 1, length($3)-1)}')
              printf "%-60s %s%%\n" "$pkg" "$pct"
              if awk -v c="$pct" -v m="$MIN" 'BEGIN { exit !(c+0 < m) }'; then
                echo "  FAIL: below ${MIN}% threshold"
                FAIL=1
              fi
              rm -f "$tmpfile"
            fi
          done
          exit $FAIL

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          files: coverage.out
          disable_search: true
          flags: backend
          fail_ci_if_error: false
          version: v11.2.8
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.out

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Generate Swagger docs
        run: swag init --parseDependency --parseInternal

      - name: Build backend
        run: go build ./...
